<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024" role="img" aria-label="The Home Bar">
  <defs>
    <radialGradient id="topglow" cx="50%" cy="22%" r="60%">
      <stop offset="0%" stop-color="#fbf3e8" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#fbf3e8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="100" height="100" fill="#bf5f3c"/>
  <rect width="100" height="100" fill="url(#topglow)"/>
  <!-- coupe bowl (glass) -->
  <path d="M28 35 Q50 61 72 35 A22 4.4 0 0 1 28 35 Z" fill="#fbf3e8"/>
  <!-- drink -->
  <path d="M31.5 35.6 Q50 57 68.5 35.6 A18.5 3.4 0 0 1 31.5 35.6 Z" fill="#c98a3a"/>
  <!-- rim highlight -->
  <path d="M31.5 35.6 A18.5 3.4 0 0 0 68.5 35.6" stroke="#f0c074" stroke-width="1" fill="none" opacity=".9"/>
  <!-- stem + foot -->
  <rect x="48.5" y="52" width="3" height="16.5" rx="1.5" fill="#fbf3e8"/>
  <ellipse cx="50" cy="70" rx="10.5" ry="2.7" fill="#fbf3e8"/>
  <!-- citrus twist -->
  <path d="M60 25 C67 26 67 33 60 34.5 C55.5 35.5 54 31 58 29.5" stroke="#f0c074" stroke-width="2.1" fill="none" stroke-linecap="round"/>
</svg>
