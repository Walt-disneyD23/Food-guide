<style>
  body{margin:0;padding:24px 20px 48px;font:17px/1.45 -apple-system,system-ui,sans-serif;background:#f6f7f9;color:#14203a}
  h1{font-size:22px;margin:0 0 4px} p{margin:0 0 18px;color:#5a6577}
  button{display:block;width:100%;box-sizing:border-box;margin:0 0 12px;padding:16px 18px;border:0;border-radius:14px;background:#14203a;color:#fff;font:600 18px/1.2 -apple-system,system-ui,sans-serif;text-align:left}
  #log{margin-top:22px;padding:14px 16px;border-radius:12px;background:#fff;border:1px solid #dfe3ea;font:14px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word}
</style></head><body>
<h1>OG probe · wide</h1>
<p>Shares a picture plus this page's own link (shape B). The preview card is what iMessage builds from this page's tags.</p>
<button id="go">Share picture + link (W)</button>
<div id="log">ready</div>
<script>
(function(){
  var LINK="https://walt-disneyd23.github.io/Food-guide/og-probe-wide.html";
  var log=document.getElementById("log");
  function say(s){log.textContent+="\n"+s;}
  document.getElementById("go").addEventListener("click",function(){
    var cv=document.createElement("canvas");cv.width=600;cv.height=400;var x=cv.getContext("2d");
    x.fillStyle="#14203a";x.fillRect(0,0,600,400);x.fillStyle="#fff";x.textAlign="center";x.textBaseline="middle";
    x.font="700 220px -apple-system,system-ui,sans-serif";x.fillText("W",300,180);
    x.font="500 34px -apple-system,system-ui,sans-serif";x.fillText("og probe \u00b7 wide",300,340);
    cv.toBlob(function(blob){
      if(!blob){say("toBlob gave nothing");return;}
      var file=new File([blob],"og-wide.png",{type:"image/png"});
      var d={files:[file],url:LINK};
      say("canShare="+(navigator.canShare&&navigator.canShare(d)));
      if(!navigator.share){say("no navigator.share");return;}
      navigator.share(d).then(function(){say("share resolved");})["catch"](function(e){say("share rejected \u2014 "+(e&&e.name)+" "+(e&&e.message));});
    },"image/png");
  });
})();
</script>
